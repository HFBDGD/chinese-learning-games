<!doctype html>
<html lang="zh-Hant-HK"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f5ed"><title>小小閱讀家｜廣東話閱讀練習</title><style>
:root{--ink:#243e39;--green:#245a49;--cream:#f7f5ed;--line:#dce3d8;--gold:#ffe185}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang HK","Noto Sans TC",sans-serif}button,select{font:inherit}button{cursor:pointer;touch-action:manipulation}button:focus-visible,summary:focus-visible{outline:3px solid #bd7135;outline-offset:4px}button:disabled{opacity:.45;cursor:default}header{max-width:1180px;margin:auto;padding:26px 28px 18px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;gap:12px;align-items:center}.logo{background:var(--green);border-radius:15px;color:white;font-size:25px;padding:10px 13px}.brand strong{display:block;font-size:21px}.sub{font-size:12px;color:#657870;letter-spacing:.05em;margin-top:4px}.badge{font-size:13px;background:#e6eddf;padding:9px 14px;border-radius:30px}.intro{max-width:1180px;margin:8px auto 24px;padding:0 28px}.intro h1{font-size:clamp(27px,4vw,40px);font-weight:650;margin:14px 0 9px;letter-spacing:.03em}.intro p{margin:0;color:#62766b;line-height:1.8}.layout{display:grid;grid-template-columns:220px 1fr;gap:26px;max-width:1180px;margin:auto;padding:0 28px 50px}aside{display:flex;flex-direction:column;gap:9px}.section-label{font-size:12px;letter-spacing:.12em;color:#738175;margin:0 0 8px} .lesson{display:flex;align-items:center;gap:12px;text-align:left;border:1px solid transparent;padding:15px 12px;border-radius:16px;color:var(--ink);background:transparent}.lesson.active{border-color:#cbd7c3;background:#e9efdf}.lesson .num{width:32px;height:32px;display:grid;place-items:center;background:white;border-radius:50%;font-size:13px;flex-shrink:0}.lesson strong{display:block;font-size:16px}.lesson small{display:block;font-size:11px;margin-top:4px;color:#71816f}.lesson .tick{margin-left:auto}.aside-note{font-size:13px;line-height:1.8;color:#687969;margin:18px 10px}.card{border:1px solid var(--line);border-radius:24px;background:#fffdf7;overflow:hidden;box-shadow:0 8px 28px #29412c05}.card-top{padding:25px 30px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px}.eyebrow{font-size:12px;color:#728370;letter-spacing:.1em}.card-top h2{margin:8px 0 0;font-size:26px}.scene{width:65px;height:65px;border-radius:21px;display:grid;place-items:center;font-size:34px;background:#edf1e4}.reading{padding:6px 30px 26px}.passage{font-family:"Kaiti TC","STKaiti","KaiTi",serif;font-size:clamp(29px,4vw,40px);line-height:2;letter-spacing:.1em;padding:12px 0 17px}.sentence{display:block}.char{position:relative;border-radius:7px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;transition:background .12s}.char.speaking{background:var(--gold);box-shadow:0 3px 0 #e5bd49}.char.evidence{background:#e2edcf}.char.evidence.speaking{background:var(--gold)}.char[role=button]{cursor:pointer}.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.primary,.secondary,.small-button{border:0;border-radius:12px;min-height:46px;padding:10px 18px}.primary{background:var(--green);color:white}.secondary{background:#ecf0e5;color:var(--green)}.small-button{background:white;color:var(--green);border:1px solid var(--line);font-size:14px}.speed{margin-left:auto;display:flex;gap:8px;align-items:center;font-size:13px}.speed select{background:transparent;border:1px solid #d5ddcf;border-radius:10px;padding:10px;color:var(--ink)}.hint{font-size:13px;line-height:1.8;color:#788573;margin:14px 0 0}.voice-status{font-size:13px;color:#7b532e;line-height:1.7}.wordpop{display:none;margin-top:16px;padding:12px 15px;background:#fff0bc;border-radius:12px;align-items:center;gap:14px;flex-wrap:wrap}.wordpop.show{display:flex}.wordpop strong{font-size:28px}.wordpop small{font-size:13px}.guide{background:#edf2e6;padding:16px 30px;font-size:14px;line-height:1.8;border-top:1px solid var(--line)}.guide b{color:#3f6047}.questions{margin-top:24px}.questions-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.questions-head h3{font-size:19px;margin:0}.questions-head span{font-size:13px;color:#73826e}.question{border:1px solid var(--line);background:white;border-radius:19px;padding:22px 24px;margin-bottom:14px}.q-title{font-size:20px;line-height:1.8;margin:0 0 16px;font-weight:550;display:flex;gap:12px;align-items:flex-start}.q-number{background:#f1f2e9;border-radius:9px;font-size:13px;min-width:27px;height:27px;display:grid;place-items:center;margin-top:4px}.q-text{flex:1}.speaker{background:transparent;border:1px solid #dce3d8;color:var(--green);border-radius:10px;min-width:42px;min-height:42px;font-size:18px}.answers{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.option{min-height:59px;border:1px solid #d9e0d3;border-radius:12px;background:#fdfdf8;color:var(--ink);font-size:22px;padding:10px}.option.chosen{border:2px solid var(--green);background:#edf3e7}.option.correct{border:2px solid #47773f;background:#e9f3de}.feedback{font-size:15px;line-height:1.8;margin-top:14px}.feedback:empty{display:none}.feedback.good{color:#3e6c34}.feedback.try{color:#885b2e}.fill-sentence{font-size:25px;line-height:2;margin-bottom:14px}.blank{display:inline-block;min-width:95px;padding:0 10px;border-bottom:2px solid #879c78;text-align:center;background:#f3f5ec;border-radius:7px;color:var(--green)}.wordbank{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:15px}.wordbank .option{min-width:85px;min-height:51px;font-size:21px}.finish{margin-top:20px;background:#e6eddb;padding:23px;border-radius:18px;line-height:1.8}.bottom-nav{display:flex;justify-content:space-between;margin-top:20px;gap:15px}.parent{margin-top:26px;border-top:1px solid var(--line);padding-top:18px;font-size:14px;line-height:1.9;color:#63755f}.parent summary{cursor:pointer;color:var(--green)}.parent p{margin:10px 0}footer{font-size:12px;text-align:center;color:#809078;padding:10px 20px 30px}.progress-track{height:4px;background:#e2e8d9}.progress-track div{height:100%;background:#b6c591;transition:width .3s}@media(max-width:760px){header{padding:20px}.badge{font-size:11px}.intro{padding:0 20px;margin-bottom:20px}.layout{display:block;padding:0 16px 35px}aside{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:19px}.section-label,.aside-note{display:none}.lesson{padding:10px 6px;gap:7px;background:#f0f1e7;border-radius:12px}.lesson strong{font-size:13px}.lesson small{font-size:10px}.lesson .num{width:24px;height:24px}.tick{display:none}.card-top{padding:22px 21px 12px}.reading{padding:4px 21px 22px}.guide{padding:14px 21px}.question{padding:19px 17px}.q-title{font-size:18px}.option{font-size:21px}.speed{margin-left:0}.passage{font-size:32px;letter-spacing:.04em}.scene{width:53px;height:53px;font-size:29px}.answers{gap:7px}.brand strong{font-size:18px}.logo{font-size:22px;padding:8px 10px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}

.practice-nav{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:0 0 18px}
.practice-nav a{color:var(--green);padding:12px 0;margin-right:auto}
.practice-nav button{min-height:44px}
.practice-nav .secondary[aria-pressed="true"]{background:var(--green);color:white}
.levels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:16px}
.level{display:grid;gap:5px;text-align:left;min-height:90px;padding:12px;border:1px solid #cbd7c3;border-radius:14px;background:#fffdf7;color:var(--ink)}
.level[aria-pressed="true"]{border-color:var(--green);background:#e9efdf;box-shadow:inset 0 0 0 1px var(--green)}
.level:disabled{opacity:1;background:#edece3;color:#56635a}
.level span,.level-status{font-size:13px}
.lesson .tick{display:block;color:var(--green)}
.lesson .tick:empty{display:none}
.finish p{margin:10px 0}
@media(max-width:760px){#lessons{grid-template-columns:repeat(2,minmax(0,1fr))}}
#parent-button{-webkit-touch-callout:none;user-select:none}
#parent-dialog{max-width:min(440px,calc(100% - 32px));border:1px solid var(--line);border-radius:20px;padding:24px;color:var(--ink);background:#fffdf7}
#parent-dialog::backdrop{background:#243e3970}
#parent-dialog form{display:flex;flex-wrap:wrap;gap:10px}
</style></head><body>
<header><div class="brand"><div class="logo" aria-hidden="true">讀</div><div><strong>小小閱讀家</strong><div class="sub">廣東話 · 親子閱讀時光</div></div></div><span class="badge">小一預備班</span></header>
<div class="intro">
<nav class="practice-nav" aria-label="練習選項">
  <a href="../index.html">← 返回學習樂園</a>
  <span class="badge" id="profile-label"></span>
  <button class="secondary" id="review-wrong" type="button" aria-pressed="false"></button>
  <button class="small-button" id="parent-button" type="button" aria-label="家長設定，長按兩秒開啟">家長</button>
</nav>
<h1>讀一讀，慢慢搵答案。</h1><p>每級有兩篇短文，答啱兩篇嘅所有題目，就可以去下一級。</p>
<nav id="levels" class="levels" aria-label="選擇閱讀級別"></nav></div>
<div class="layout"><aside id="lessons" aria-label="選擇短文"></aside><main id="main" tabindex="-1"></main></div><footer>長按中文字可以聽讀音 · 同爸爸媽媽一齊讀</footer>
<dialog id="parent-dialog" aria-labelledby="parent-heading">
  <h2 id="parent-heading">家長設定</h2>
  <p id="parent-scope"></p>
  <form method="dialog">
    <button class="secondary" autofocus>取消</button>
    <button class="primary" id="parent-reset" type="button">重設閱讀紀錄</button>
  </form>
</dialog>
<script src="app.js?v=levels"></script></body></html>
